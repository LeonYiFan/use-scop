          - scop::RunMonocle2
          - scop::RunMonocle3
          - scop::RunPAGA
          - scop::RunPalantir
          - scop::RunWOT
          - scop::LineagePlot
          - scop::PAGAPlot
          - scop::PseudotimeProjectionPlot
          - scop::PalantirTrajectoryPlot
          - scop::BranchStreamPlot
      - task: velocity
        use:
          - scop::RunCell2fate
          - scop::RunSCVELO
          - scop::VelocityPlot
      - task: fate_and_potency
        use:
          - scop::RunCellRankTrends
          - scop::RunCellRankEnrichment
          - scop::CellRankPlot
          - scop::RunCellRank
          - scop::RunCytoTRACE
          - scop::CytoTRACEPlot
      - task: dynamic_features
        use:
          - scop::RunDynamicFeatures
          - scop::RunDynamicEnrichment
          - scop::DynamicPlot
          - scop::DynamicHeatmap
      - task: developmental_modeling
        use:
          - scop::RunFitDevo
          - scop::FitDevoPlot

  differential_proportion_bulk:
