router_version: scop-main-d6646dc3-v3
policy: scop_first_narrow_fallback

default_package: scop
default_style: "use scop:: calls in generated R code when practical"

official_sources:
  description: https://raw.githubusercontent.com/mengxu98/scop/HEAD/DESCRIPTION
  namespace: https://raw.githubusercontent.com/mengxu98/scop/HEAD/NAMESPACE
  news: https://raw.githubusercontent.com/mengxu98/scop/HEAD/NEWS.md
  docs: https://mengxu98.github.io/scop/

baseline:
  source: official GitHub DESCRIPTION
  version: 0.9.1
  date: "2026-09-01"
  main_commit: "d6646dc31cfb1c6229558f15ed813caa1ff01200"
  synchronized: "2026-09-05"
  notes:
    - GitHub releases and tags may be empty; do not infer release status from tags.
    - The snapshot describes source capabilities, not installed backend readiness.
    - pkgdown pages can lag behind GitHub source.

runtime_check:
  installed_package:
    - requireNamespace("scop", quietly = TRUE)
    - as.character(utils::packageVersion("scop"))
  when_to_check:
    - before claiming generated code is runnable
    - before using version-sensitive arguments
    - before using routes marked requires_export_check

compatibility_aliases:
  standard_scop: RunStandardWorkflow
  integration_scop: RunIntegration

removed_from_routes:
  - AddGiottoToSeurat
  - BenchmarkPlot
  - GiottoPlot
  - LISIPlot
  - LoadScopDataset
  - RunGiottoCellProximity
  - RunGiottoCluster
  - RunGiottoSpatialGenes
  - RunGiottoSpatialModules
  - RunGiottoWorkflow
  - RunSemlaLocalG
  - RunSemlaRadialDistance
  - RunSemlaRegionNeighbors
  - RunSemlaSpatialNetwork
  - RunSpatialQM
  - spata2_to_srt
  - srt_to_spata2

stale_interfaces:
  avoid:
    - RunDimReduction
    - CellChatPlot
    - group_by
    - num_threads
  prefer:
    - RunDimsReduction
    - CCCStatPlot
    - CCCHeatmap
    - CCCNetworkPlot
    - group.by
    - cores

fallback_rule: If a requested workflow step has no SCOP route, name the unsupported step, say SCOP does not appear to provide a direct route, then use Seurat or ggplot2 only for that specific step if needed. Never silently replace a SCOP-capable step.

known_unexported:
  - name: RunBulk
    reason: Mentioned in NEWS.md but not exported by upstream main NAMESPACE at the synchronized commit; do not generate a namespaced RunBulk call until it is exported.

domains:
  io_and_conversion:
    intent: Read, convert, and export single-cell objects through SCOP.
    routes:
      - task: h5ad_to_seurat
        use:
          - scop::h5ad_to_srt
          - scop::adata_to_srt
      - task: seurat_to_anndata
        use:
          - scop::srt_to_adata
          - scop::srt_to_h5ad
      - task: loom_velocity_input
        use:
          - scop::loom_to_srt
          - scop::loom_to_adata
      - task: scexplorer_files
        use:
          - scop::PrepareSCExplorer
          - scop::CreateDataFile
          - scop::CreateMetaFile
          - scop::FetchH5
          - scop::RunSCExplorer
      - task: spatial_framework_conversion
        use:
          - scop::spe_to_srt
          - scop::srt_to_spe
          - scop::giotto_to_srt
          - scop::srt_to_giotto

  qc_and_preprocessing:
    intent: Run SCOP quality control, normalization, clustering, and reduction workflows.
    routes:
      - task: qc_filtering
        use:
          - scop::RunscDblFinder
          - scop::Runscds
          - scop::RunScrublet
          - scop::RunDoubletDetection
          - scop::RunCellQC
          - scop::RunDoubletCalling
          - scop::RunDecontX
      - task: standard_workflow
        use:
          - scop::RunStandardWorkflow
      - task: preprocessing_steps
        use:
          - scop::NormalizeData
          - scop::FindVariableFeatures
          - scop::ScaleData
          - scop::SCTransform
          - scop::FindNeighbors
          - scop::FindClusters
          - scop::RunDimsReduction
          - scop::RunDimsEstimate
          - scop::DimsEstimatePlot
      - task: dimension_reduction
        use:
          - scop::RunPCA
          - scop::RunMDS
          - scop::RunDM
          - scop::RunFR
          - scop::RunGLMPCA
          - scop::RunHarmony2
          - scop::RunLargeVis
          - scop::RunNMF
          - scop::RunPaCMAP
          - scop::RunPHATE
          - scop::RunTriMap
          - scop::RunUMAP
          - scop::RunUMAP2
      - task: cluster_structure
        use:
          - scop::ClusterTreePlot
          - scop::NMFHeatmap
      - task: cell_cycle
        use:
          - scop::CycGenePrefetch
          - scop::RunCellCycle
      - task: atac_qc
        use:
          - scop::RunATACQC
      - task: spatial_qc
        use:
          - scop::RunSpotQC

  integration_mapping_annotation:
